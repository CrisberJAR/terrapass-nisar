# TerraPass v3 · CI/CD to Azure App Service
# Setup once:
#   1. Azure Portal > your Web App > "Download publish profile"
#   2. GitHub repo > Settings > Secrets and variables > Actions:
#        AZURE_WEBAPP_PUBLISH_PROFILE = (contents of the publish profile)
#      and Variables:
#        AZURE_WEBAPP_NAME = terrapass-nisar-xxxxx
name: Deploy TerraPass to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install & smoke test
        run: |
          npm ci --omit=dev
          node server.js & echo $! > pid
          sleep 3
          curl -fsS http://localhost:8080/api/health
          kill $(cat pid)

      - name: Package
        run: zip -qr app.zip server.js package.json package-lock.json public node_modules

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

